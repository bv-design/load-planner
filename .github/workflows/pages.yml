# Демо-версия на GitHub Pages: только статика из public/.
# Общий список планов там недоступен, планы хранятся в браузере и передаются файлом JSON.
# Включение: Settings → Pages → Source: GitHub Actions.
name: Демо на GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
