# Пример для nginx: приложение по адресу https://portal.company.local/loadplanner/
# Пароль на вход (рекомендуется на время теста):
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-loadplanner ivanov

location = /loadplanner { return 301 /loadplanner/; }

location /loadplanner/ {
    auth_basic           "Планировщик загрузки";
    auth_basic_user_file /etc/nginx/.htpasswd-loadplanner;

    proxy_pass http://127.0.0.1:8080/;      # завершающий слэш убирает префикс /loadplanner
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
}

